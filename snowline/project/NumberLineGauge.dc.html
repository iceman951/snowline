<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:11px;min-width:0">
  <sc-if value="{{ hasHead }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-height:22px">
      <sc-if value="{{ statement }}" hint-placeholder-val="{{ true }}">
        <span style="font-size:13px;color:var(--t1);line-height:1.4">{{ statement }}</span>
      </sc-if>
      <sc-if value="{{ verdict }}" hint-placeholder-val="{{ true }}">
        <span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:5px;background:{{ verdictBg }};color:{{ verdictFg }};font-size:11px;font-weight:500;white-space:nowrap">
          <span style="width:5px;height:5px;border-radius:1px;background:currentColor;opacity:.75"></span>{{ verdict }}
        </span>
      </sc-if>
    </div>
  </sc-if>

  <div style="position:relative;height:50px">
    <span style="position:absolute;left:0;right:0;top:38px;height:3px;border-radius:2px;background:var(--track, var(--line))"></span>
    <span style="position:absolute;left:0;top:38px;width:{{ fillWidth }};height:3px;border-radius:2px;background:var(--accent-4)"></span>
    <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="8">
      <span style="position:absolute;left:{{ t.x }};top:38px;width:1px;height:{{ t.h }};background:var(--tick, var(--line))"></span>
    </sc-for>
    <sc-for list="{{ markers }}" as="m" hint-placeholder-count="2">
      <span style="position:absolute;left:{{ m.x }};top:{{ m.labelTop }};transform:translateX(-50%);display:flex;align-items:baseline;gap:5px;z-index:{{ m.z }};pointer-events:none">
        <span style="font-size:11px;color:{{ m.labelColor }};white-space:nowrap;line-height:1.3">{{ m.label }}</span>
        <span style="font-size:12px;font-weight:600;color:{{ m.color }};white-space:nowrap;line-height:1.3">{{ m.value }}</span>
      </span>
      <span style="position:absolute;left:{{ m.x }};top:{{ m.dotTop }};width:{{ m.size }};height:{{ m.size }};background:{{ m.fill }};border:2px solid {{ m.color }};border-radius:{{ m.radius }};transform:translateX(-50%) rotate({{ m.rotate }});box-shadow:0 0 0 3px var(--card);z-index:{{ m.z }}"></span>
    </sc-for>
  </div>

  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px">
    <span style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);min-width:0">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" style="flex:none"><path d="M9 2L4 6l5 4"></path></svg>
      <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ minLabel }}</span>
    </span>
    <span style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);min-width:0">
      <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ maxLabel }}</span>
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" style="flex:none"><path d="M3 2l5 4-5 4"></path></svg>
    </span>
  </div>

  <sc-if value="{{ note }}" hint-placeholder-val="{{ true }}">
    <span style="font-size:11px;line-height:1.5;color:var(--t3);border-top:1px solid var(--line);padding-top:9px">{{ note }}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:150},&quot;min&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;max&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:70,&quot;tsType&quot;:&quot;number&quot;},&quot;minLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0x cheap&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;maxLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;70x expensive&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;statement&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Verdict&quot;},&quot;verdict&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Verdict&quot;},&quot;verdictTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;good&quot;,&quot;neutral&quot;,&quot;attention&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;'good'|'neutral'|'attention'&quot;,&quot;section&quot;:&quot;Verdict&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Verdict&quot;},&quot;tickValues&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;markers&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{value:number,label:string,display?:string,primary?:boolean,shape?:'circle'|'square'|'diamond'}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const min = p.min === undefined ? 0 : p.min;
    const max = p.max === undefined ? 100 : p.max;
    const span = (max - min) || 1;
    const pos = (v) => (v - min) / span * 100;
    const clamp = (v) => Math.min(99.2, Math.max(0.8, pos(v)));
    const marks = p.markers || [];
    const primary = marks.filter((m) => m.primary !== false)[0];
    const tone = p.verdictTone || 'neutral';

    /* an interior tick is a hairline; the two endpoints get a taller one */
    const ticks = (p.tickValues || []).map((v) => ({
      x: Math.min(100, Math.max(0, pos(v))).toFixed(2) + '%',
      h: v === min || v === max ? '9px' : '6px'
    }));

    /* labels stagger up when two markers land within 16% of each other */
    const at = marks.map((m) => pos(m.value));
    return {
      hasHead: !!(p.statement || p.verdict),
      statement: p.statement ?? '',
      verdict: p.verdict ?? '',
      verdictBg: tone === 'good' ? 'var(--accent-soft)' : tone === 'attention' ? 'var(--tag-bg)' : 'var(--chip-bg)',
      verdictFg: tone === 'good' ? 'var(--accent)' : tone === 'attention' ? 'var(--tag-fg)' : 'var(--t2)',
      note: p.note ?? '',
      ticks: ticks,
      fillWidth: primary ? clamp(primary.value).toFixed(2) + '%' : '0%',
      minLabel: p.minLabel || String(min),
      maxLabel: p.maxLabel || String(max),
      markers: marks.map((m, i) => {
        const near = at.some((q, j) => j < i && Math.abs(q - at[i]) < 16);
        const isPrimary = m.primary !== false;
        return {
          x: clamp(m.value).toFixed(2) + '%',
          label: m.label,
          value: m.display ?? String(m.value),
          color: isPrimary ? 'var(--accent)' : 'var(--t2)',
          labelColor: isPrimary ? 'var(--t2)' : 'var(--t3)',
          fill: isPrimary ? 'var(--accent)' : 'var(--card)',
          size: isPrimary ? '11px' : '9px',
          dotTop: isPrimary ? '34px' : '35px',
          radius: m.shape === 'square' ? '2px' : '50%',
          rotate: m.shape === 'diamond' ? '45deg' : '0deg',
          labelTop: near ? '0px' : '16px',
          z: isPrimary ? 3 : 2
        };
      })
    };
  }
}
</script>
</body>
</html>
