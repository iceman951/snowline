<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);flex-wrap:wrap">
  <div style="display:flex;align-items:flex-end;gap:2px;flex-wrap:wrap;flex:1">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
      <a href="{{ t.href }}" style="display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-bottom:2px solid {{ t.rule }};color:{{ t.color }};font-size:13px;font-weight:{{ t.weight }};text-decoration:none;white-space:nowrap;margin-bottom:-1px" style-hover="color:var(--t1)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="{{ t.iconOp }}"><path d="{{ t.d }}"></path></svg>
        {{ t.label }}
      </a>
    </sc-for>
  </div>

  <span style="display:flex;align-items:center;gap:9px;padding-bottom:9px;white-space:nowrap">
    <span style="font-size:11.5px;color:var(--t3)">{{ scopeNote }}</span>
  </span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1344,&quot;height&quot;:48},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Common&quot;,&quot;Diversification&quot;,&quot;Dividends&quot;,&quot;Growth&quot;,&quot;Metrics&quot;,&quot;Report&quot;],&quot;default&quot;:&quot;Common&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menu: null };

  componentDidMount() {
    this.doc = () => { if (this.state.menu) this.setState({ menu: null }); };
    document.addEventListener('click', this.doc);
    if (!window.SnowlineData) {
      const check = () => { if (window.SnowlineData) this.forceUpdate(); else setTimeout(check, 30); };
      setTimeout(check, 20);
    }
  }
  componentWillUnmount() { if (this.doc) document.removeEventListener('click', this.doc); }

  renderVals() {
    const st = this.state;
    const active = this.props.active || 'Common';
    const I = {
      bars: 'M4 20V10M10 20V4M16 20v-7M22 20H2', pie: 'M12 3a9 9 0 1 0 9 9h-9V3Z',
      coins: 'M4 8h13l-3-3M20 16H7l3 3', trend: 'M3 17l6-6 4 4 8-8M21 7v6h-6',
      gauge: 'M4 18a8 8 0 1 1 16 0M12 18l4-6', doc: 'M6 3h8l5 5v13H6V3Zm8 0v5h5'
    };
    const tog = (k) => (e) => { e.stopPropagation(); this.setState((s) => ({ menu: s.menu === k ? null : k })); };
    const D = window.SnowlineData;

    const tabs = [
      { label: 'Common', d: I.bars, href: 'Analytics.dc.html' },
      { label: 'Diversification', d: I.pie, href: 'Diversification.dc.html' },
      { label: 'Dividends', d: I.coins, href: 'AnalyticsDividends.dc.html' },
      { label: 'Growth', d: I.trend, href: 'Growth.dc.html' },
      { label: 'Metrics', d: I.gauge, href: 'Metrics.dc.html' },
      { label: 'Report', d: I.doc, href: 'Report.dc.html' }
    ].map((t) => ({
      label: t.label, d: t.d, href: t.href,
      rule: t.label === active ? 'var(--accent)' : 'transparent',
      color: t.label === active ? 'var(--accent)' : 'var(--t2)',
      weight: t.label === active ? 600 : 500,
      iconOp: t.label === active ? 1 : 0.6
    }));

    return {
      stop: (e) => e.stopPropagation(),
      tabs: tabs,
      /* honest about scope: every analytics screen computes over the whole history */
      scopeNote: D
        ? D.constants.portfolioName + ' · all time, through ' + D.constants.today.label
        : ''
    };
  }
}
</script>
</body>
</html>
