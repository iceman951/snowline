<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%;align-items:{{ items }}">
  <span style="font-size:13px;font-weight:500;line-height:1.35;color:{{ primaryColor }};white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis">{{ primary }}</span>
  <span style="font-size:12px;line-height:1.35;color:{{ secondaryColor }};white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis">{{ secondary }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:44},&quot;primary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$5,240.22&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$5,230.30 invested&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;plain&quot;,&quot;pos&quot;,&quot;neg&quot;],&quot;default&quot;:&quot;plain&quot;,&quot;tsType&quot;:&quot;'plain'|'pos'|'neg'&quot;},&quot;secondaryTone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;plain&quot;,&quot;pos&quot;,&quot;neg&quot;],&quot;default&quot;:&quot;plain&quot;,&quot;tsType&quot;:&quot;'plain'|'pos'|'neg'&quot;},&quot;align&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;left&quot;,&quot;right&quot;],&quot;default&quot;:&quot;left&quot;,&quot;tsType&quot;:&quot;'left'|'right'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const tone = (t) => t === 'pos' ? 'var(--accent)' : t === 'neg' ? 'var(--neg)' : 'var(--t1)';
    return {
      primary: p.primary ?? '—',
      secondary: p.secondary ?? '',
      primaryColor: tone(p.tone),
      secondaryColor: p.secondaryTone === 'pos' ? 'var(--accent)' : p.secondaryTone === 'neg' ? 'var(--neg)' : 'var(--t2)',
      items: p.align === 'right' ? 'flex-end' : 'flex-start'
    };
  }
}
</script>
</body>
</html>
