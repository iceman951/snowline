<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-width:212px;max-width:280px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:11px 12px;display:flex;flex-direction:column;gap:9px">
  <div style="display:flex;flex-direction:column;gap:3px">
    <span style="font-size:10px;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;color:var(--t3)">{{ title }}</span>
    <span style="font-size:17px;font-weight:600;letter-spacing:-0.02em;color:var(--t1);line-height:1.1">{{ headline }}</span>
    <sc-if value="{{ sub }}" hint-placeholder-val="{{ false }}">
      <span style="font-size:11px;color:var(--t3);line-height:1.4">{{ sub }}</span>
    </sc-if>
  </div>
  <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:0">
      <div style="height:1px;background:var(--line);margin-bottom:8px"></div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:18px">
            <span style="display:flex;align-items:center;gap:7px;min-width:0">
              <span style="width:7px;height:7px;flex:none;border-radius:1px;background:{{ r.color }}"></span>
              <span style="font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.label }}</span>
            </span>
            <span style="font-size:12px;font-weight:500;color:{{ r.valueColor }};white-space:nowrap">{{ r.value }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ footer }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:0">
      <div style="height:1px;background:var(--line);margin-bottom:8px"></div>
      <span style="font-size:11px;font-weight:500;color:{{ footerColor }}">{{ footer }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:190},&quot;tip&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{title:string,headline:string,sub?:string,rows?:{label:string,value:string,color?:string,tone?:'pos'|'neg'}[],footer?:string,footerTone?:'pos'|'neg'}&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const t = this.props.tip || {};
    const rows = (t.rows || []).map((r) => ({
      label: r.label,
      value: r.value,
      color: r.color || 'var(--t3)',
      valueColor: r.tone === 'pos' ? 'var(--accent)' : r.tone === 'neg' ? 'var(--neg)' : 'var(--t1)'
    }));
    return {
      title: t.title ?? '',
      headline: t.headline ?? '',
      sub: t.sub ?? '',
      rows: rows,
      hasRows: rows.length > 0,
      footer: t.footer ?? '',
      footerColor: t.footerTone === 'pos' ? 'var(--accent)' : t.footerTone === 'neg' ? 'var(--neg)' : 'var(--t2)'
    };
  }
}
</script>
</body>
</html>
